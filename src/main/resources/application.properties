spring.application.name=ecomerce-api

server.port=8080

# Subida de imágenes de producto (multipart). Por defecto Spring limita a 1MB por archivo,
# lo que hacía fallar fotos comunes. Subimos el límite y ampliamos el swallow de Tomcat para
# que una subida demasiado grande devuelva un error legible en vez de cortar la conexión.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
# -1 = Tomcat lee (descarta) el cuerpo excedente para poder responder un 413 legible
# en vez de cortar la conexión ("Network Error") ante una subida demasiado grande.
server.tomcat.max-swallow-size=-1

spring.datasource.url=jdbc:mysql://localhost:3306/ecomerce_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=ecomerce
spring.datasource.password=ecomerce123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

application.security.jwt.secret-key=change-this-secret-key-please-change-this-secret-key-123456
application.security.jwt.expiration-ms=86400000
